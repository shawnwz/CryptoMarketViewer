<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="373" height="810" rx="28" fill="white" stroke="black" stroke-width="3"/>

  <!-- language pills -->
  <rect x="120" y="60" width="40" height="22" rx="11" fill="none" stroke="black"/>
  <text x="140" y="75" font-size="10" text-anchor="middle">EN</text>
  <rect x="166" y="60" width="40" height="22" rx="11" fill="none" stroke="black"/>
  <text x="186" y="75" font-size="10" text-anchor="middle">中</text>
  <rect x="212" y="60" width="40" height="22" rx="11" fill="none" stroke="black"/>
  <text x="232" y="75" font-size="10" text-anchor="middle">日</text>

  <!-- title -->
  <text x="187" y="140" font-size="22" text-anchor="middle" font-weight="bold">Log In</text>

  <!-- email field -->
  <rect x="40" y="200" width="295" height="46" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="52" y="228" font-size="13" fill="#888">Email</text>

  <!-- password field -->
  <rect x="40" y="262" width="295" height="46" rx="6" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="52" y="290" font-size="13" fill="#888">Password</text>

  <!-- button -->
  <rect x="40" y="332" width="295" height="50" rx="6" fill="black"/>
  <text x="187" y="363" font-size="15" fill="white" text-anchor="middle">Log In</text>

  <!-- link -->
  <text x="187" y="410" font-size="12" text-anchor="middle" fill="#555">Don't have an account? <tspan text-decoration="underline">Sign up</tspan></text>

  <!-- annotation -->
  <text x="187" y="760" font-size="11" text-anchor="middle" fill="#aaa">wireframe — login screen</text>
</svg>
