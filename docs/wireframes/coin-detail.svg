<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="373" height="810" rx="28" fill="white" stroke="black" stroke-width="3"/>

  <!-- header -->
  <path d="M30 52 l-8 8 l8 8" fill="none" stroke="black" stroke-width="2"/>
  <text x="187" y="58" font-size="16" text-anchor="middle" font-weight="bold">Bitcoin</text>
  <path d="M0,-6 L1.8,-1.9 L6,-1.9 L2.7,1.1 L3.7,5.9 L0,3.2 L-3.7,5.9 L-2.7,1.1 L-6,-1.9 L-1.8,-1.9 Z" fill="none" stroke="black" stroke-width="1" transform="translate(345,52)"/>
  <line x1="0" y1="76" x2="375" y2="76" stroke="black" stroke-width="1"/>

  <!-- coin header row -->
  <circle cx="45" cy="112" r="20" fill="none" stroke="black"/>
  <rect x="80" y="100" width="90" height="10" fill="#333"/>
  <rect x="80" y="116" width="60" height="7" fill="#bbb"/>

  <!-- price block -->
  <rect x="30" y="150" width="120" height="20" fill="#222"/>
  <rect x="30" y="176" width="70" height="9" fill="#999"/>

  <!-- change pills -->
  <g stroke="black" fill="none">
    <rect x="30" y="204" width="52" height="26" rx="6"/>
    <rect x="90" y="204" width="52" height="26" rx="6"/>
    <rect x="150" y="204" width="52" height="26" rx="6"/>
    <rect x="210" y="204" width="52" height="26" rx="6"/>
  </g>
  <text x="56" y="221" font-size="9" text-anchor="middle">1h</text>
  <text x="116" y="221" font-size="9" text-anchor="middle">24h</text>
  <text x="176" y="221" font-size="9" text-anchor="middle">7d</text>
  <text x="236" y="221" font-size="9" text-anchor="middle">30d</text>

  <!-- chart box -->
  <rect x="30" y="252" width="315" height="140" fill="none" stroke="black" stroke-dasharray="4 3"/>
  <polyline points="40,360 80,320 120,340 160,290 200,310 240,270 280,300 335,265"
            fill="none" stroke="black" stroke-width="1.5"/>

  <!-- range selector -->
  <g stroke="black" fill="none">
    <rect x="30" y="404" width="56" height="26" rx="6" fill="#222" stroke="none"/>
    <rect x="92" y="404" width="56" height="26" rx="6"/>
    <rect x="154" y="404" width="56" height="26" rx="6"/>
    <rect x="216" y="404" width="56" height="26" rx="6"/>
    <rect x="278" y="404" width="56" height="26" rx="6"/>
  </g>
  <text x="58" y="421" font-size="9" text-anchor="middle" fill="white">1D</text>
  <text x="120" y="421" font-size="9" text-anchor="middle">7D</text>
  <text x="182" y="421" font-size="9" text-anchor="middle">30D</text>
  <text x="244" y="421" font-size="9" text-anchor="middle">90D</text>
  <text x="306" y="421" font-size="9" text-anchor="middle">1Y</text>

  <!-- stats block -->
  <rect x="30" y="454" width="315" height="150" rx="8" fill="none" stroke="black" stroke-width="1"/>
  <g fill="#666">
    <rect x="44" y="470" width="70" height="7"/>
    <rect x="300" y="470" width="30" height="7"/>
    <line x1="44" y1="486" x2="330" y2="486" stroke="#eee"/>

    <rect x="44" y="498" width="90" height="7"/>
    <rect x="290" y="498" width="40" height="7"/>
    <line x1="44" y1="514" x2="330" y2="514" stroke="#eee"/>

    <rect x="44" y="526" width="75" height="7"/>
    <rect x="295" y="526" width="35" height="7"/>
    <line x1="44" y1="542" x2="330" y2="542" stroke="#eee"/>

    <rect x="44" y="554" width="85" height="7"/>
    <rect x="290" y="554" width="40" height="7"/>
    <line x1="44" y1="570" x2="330" y2="570" stroke="#eee"/>

    <rect x="44" y="582" width="65" height="7"/>
    <rect x="300" y="582" width="30" height="7"/>
  </g>

  <!-- about section -->
  <text x="30" y="632" font-size="13" font-weight="bold">About</text>
  <g fill="#bbb">
    <rect x="30" y="642" width="315" height="7"/>
    <rect x="30" y="656" width="315" height="7"/>
    <rect x="30" y="670" width="200" height="7"/>
  </g>

  <!-- tags -->
  <g stroke="black" fill="none">
    <rect x="30" y="690" width="46" height="20" rx="10"/>
    <rect x="82" y="690" width="60" height="20" rx="10"/>
    <rect x="148" y="690" width="52" height="20" rx="10"/>
  </g>

  <text x="187" y="760" font-size="11" text-anchor="middle" fill="#aaa">wireframe — coin detail</text>
</svg>
